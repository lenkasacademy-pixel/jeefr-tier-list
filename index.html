<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>JeeForReal — Maths Chapter Tier List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Every size below is a plain pixel value that JS measures and writes onto
   #stage. No container queries, no viewport units inside the board — so the
   board lays out identically in Safari, Chrome and Firefox, on an iPad or a
   720p projector, and the same code drives the 1080x1920 reel canvas. */
:root{
  --ink:#1a1030; --paper:#fdf7ec; --muted:#a693cc; --cyan:#22d3ee;
  --s:#ff2e63; --a:#ff8a3d; --b:#ffd93d; --c:#4ade80; --d:#60a5fa;
  --padx:14px; --padt:12px; --padb:10px; --gap:6px; --radius:10px;
  --brand:30px; --sub:14px; --badgew:70px; --badgef:30px;
  --trayh:280px; --traybarf:14px; --hintsf:12px; --outh2:22px; --outbody:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#05030b;color:#fdf7ec;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  touch-action:manipulation;-webkit-text-size-adjust:100%;
  font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif}

#fit{position:fixed;inset:0;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left)}

#stage{position:absolute;inset:0;max-width:100%;max-height:100%;
  transform-origin:center;
  background:
    radial-gradient(120% 45% at 50% -8%,#2d1657 0%,transparent 60%),
    radial-gradient(110% 35% at 50% 110%,#0c2b40 0%,transparent 58%),
    linear-gradient(#130d24,#0a0714);
  color:var(--paper);display:flex;flex-direction:column;overflow:hidden;
  padding:var(--padt) var(--padx) var(--padb)}
/* reel canvas: a fixed 1080x1920 board that is scaled to fit the window */
#stage.reel{inset:auto;left:50%;top:50%;width:1080px;height:1920px;
  max-width:none;max-height:none;flex:none}

header{flex:none;text-align:center;margin-bottom:var(--gap)}
.brand{font-size:var(--brand);font-weight:700;letter-spacing:.02em;line-height:1}
.brand i{font-style:normal;color:var(--cyan);text-shadow:0 0 14px rgba(34,211,238,.5)}
.sub{margin-top:3px;font-size:var(--sub);font-weight:500;color:var(--muted)}

#shelves{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;gap:var(--gap)}
.tier{display:flex;flex:1;min-height:0;min-width:0;border-radius:var(--radius);
  overflow:hidden;background:rgba(255,255,255,.035);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
  transition:box-shadow .14s,background .14s}
.tier.over{box-shadow:inset 0 0 0 2px var(--cyan);background:rgba(34,211,238,.1)}
.badge{width:var(--badgew);flex:none;display:grid;place-items:center;
  font-size:var(--badgef);font-weight:700;color:#150b24;
  text-shadow:0 1px 0 rgba(255,255,255,.28)}
.tier[data-t="S"] .badge{background:linear-gradient(155deg,#ff6b93,var(--s))}
.tier[data-t="A"] .badge{background:linear-gradient(155deg,#ffb877,var(--a))}
.tier[data-t="B"] .badge{background:linear-gradient(155deg,#ffeb9b,var(--b))}
.tier[data-t="C"] .badge{background:linear-gradient(155deg,#9af2be,var(--c))}
.tier[data-t="D"] .badge{background:linear-gradient(155deg,#a5cbff,var(--d))}
.shelf{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-content:flex-start;
  gap:6px 8px;padding:6px 10px;background:rgba(8,4,18,.42);
  overflow:hidden}

.card{flex:0 0 auto;width:var(--cw,70px);height:var(--cw,70px);display:flex;
  align-items:center;justify-content:center;text-align:center;
  padding:4px 3px;overflow:hidden;
  border-radius:8px;border-top:3px solid var(--edge);background:var(--tint);
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
  box-shadow:0 3px 7px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.6)}
.card span{display:block;width:100%;font-size:11px;font-weight:700;
  line-height:1.12;color:var(--ink)}
.card.picked{box-shadow:0 0 0 3px var(--cyan),0 0 16px rgba(34,211,238,.6)}
.card.lifted{opacity:.25}
.card.in{animation:land .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes land{from{transform:translateY(-14px) rotate(-5deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.card.ghost{position:absolute;z-index:30;pointer-events:none;opacity:.96;
  transform:translate(-50%,-50%) rotate(-3deg) scale(1.08);
  box-shadow:0 12px 22px rgba(0,0,0,.6)}

#tray{flex:none;height:var(--trayh);margin-top:var(--gap);min-width:0;
  display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;
  background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
  transition:box-shadow .14s}
#tray.over{box-shadow:inset 0 0 0 2px var(--cyan)}
#traybar{flex:none;display:flex;justify-content:space-between;align-items:center;
  gap:10px;padding:6px 12px;background:rgba(255,255,255,.05);
  font-size:var(--traybarf);font-weight:600}
#traybar span{color:var(--muted);font-weight:500;white-space:nowrap}
#pool{flex:1;min-height:0;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;display:flex;flex-wrap:wrap;
  align-content:flex-start;gap:6px 8px;padding:8px 12px}
#pool:empty::after{content:"Every chapter is on the board.";color:var(--muted);
  font-size:var(--traybarf);font-weight:500;margin:auto}

#hints{flex:none;margin-top:var(--gap);display:flex;flex-wrap:wrap;
  justify-content:center;align-items:center;gap:8px 14px;
  font-size:var(--hintsf);font-weight:500;color:#8d79b4}
#hints kbd{display:inline-block;margin:0 1px;padding:1px 5px;border-radius:4px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);
  color:#c4b4e2;font-family:inherit;font-size:.92em;font-weight:600}
#hints.hide{visibility:hidden}
#hints button{font-size:var(--hintsf);min-height:34px;padding:6px 14px;
  border-radius:8px;background:rgba(34,211,238,.16);color:var(--cyan);
  border:1px solid rgba(34,211,238,.4)}
.tt{display:none}
body.touch .kb{display:none}
body.touch .tt{display:inline}
body.touch #hints button{min-height:44px;padding:9px 18px}

#out{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;gap:14px;
  padding:24px 26px;background:rgba(7,4,15,.985);-webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px)}
#out.on{display:flex}
#out h2{font-size:var(--outh2);font-weight:700}
#outbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;white-space:pre-wrap;
  font-size:var(--outbody);line-height:1.6;color:#d6c9f0;
  user-select:text;-webkit-user-select:text}
#out .row{display:flex;flex-wrap:wrap;gap:12px}
#out button{font-size:var(--hintsf);min-height:44px;padding:10px 20px;border-radius:10px}
button{font-family:inherit;font-weight:600;border:0;cursor:pointer;
  touch-action:manipulation;background:var(--cyan);color:#06222a}
button.ghost{background:rgba(255,255,255,.12);color:var(--paper)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="fit"><div id="stage">

  <header>
    <div class="brand">JEE <i>FOR</i> REAL</div>
    <div class="sub">Maths chapter tier list</div>
  </header>

  <div id="shelves"></div>

  <div id="tray">
    <div id="traybar">
      <b>Chapters</b>
      <span id="remain"></span>
    </div>
    <div id="pool"></div>
  </div>

  <div id="hints">
    <span class="kb">Drag a chapter onto a tier, or tap it then press
    <kbd>S</kbd><kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd></span>
    <span class="kb"><kbd>X</kbd> list · <kbd>H</kbd> hide · <kbd>R</kbd> reset</span>
    <span class="tt">Tap a chapter, then tap a tier — or drag it across.</span>
    <button id="listbtn">List</button>
    <button id="resetbtn">Reset</button>
    <button id="reelbtn">Reel 9:16</button>
  </div>

  <div id="out">
    <h2>Your tier list</h2>
    <div id="outbody"></div>
    <div class="row">
      <button id="copy">Copy list</button>
      <button class="ghost" id="close">Back to the board</button>
    </div>
  </div>

</div></div>

<script>
const GROUPS={
  algebra: {edge:"#6d28d9",tint:"#ece6fe"},
  trig:    {edge:"#be185d",tint:"#fce7f3"},
  coord:   {edge:"#0e7490",tint:"#d4f7fb"},
  calculus:{edge:"#b45309",tint:"#fdf0cd"},
  vectors: {edge:"#047857",tint:"#d3f7e6"},
  chance:  {edge:"#be123c",tint:"#ffe3e7"},
};

const CHAPTERS=[
  ["Sets, Relations & Functions","Sets & Functions","algebra"],
  ["Complex Numbers","Complex Numbers","algebra"],
  ["Quadratic Equations","Quadratic Equations","algebra"],
  ["Matrices & Determinants","Matrices","algebra"],
  ["Permutations & Combinations","Perm & Comb","algebra"],
  ["Binomial Theorem","Binomial Theorem","algebra"],
  ["Sequences & Series","Sequences & Series","algebra"],
  ["Trigonometric Identities","Trig Identities","trig"],
  ["Trigonometric Equations","Trig Equations","trig"],
  ["Inverse Trigonometry","Inverse Trig","trig"],
  ["Solution of Triangles","Solution of Triangles","trig"],
  ["Straight Lines","Straight Lines","coord"],
  ["Circles","Circles","coord"],
  ["Parabola","Parabola","coord"],
  ["Ellipse","Ellipse","coord"],
  ["Hyperbola","Hyperbola","coord"],
  ["Limits","Limits","calculus"],
  ["Continuity & Differentiability","Continuity & Diff","calculus"],
  ["Application of Derivatives","Derivatives (AOD)","calculus"],
  ["Indefinite Integration","Indefinite Integration","calculus"],
  ["Definite Integration","Definite Integration","calculus"],
  ["Area Under Curves","Area Under Curves","calculus"],
  ["Differential Equations","Differential Equations","calculus"],
  ["Vector Algebra","Vector Algebra","vectors"],
  ["3D Geometry","3D Geometry","vectors"],
  ["Probability","Probability","chance"],
  ["Statistics","Statistics","chance"],
].map(function(r,i){return {id:i,name:r[0],short:r[1],group:r[2]};});

const TIERS=["S","A","B","C","D"];
const fitEl=document.getElementById("fit");
const stageEl=document.getElementById("stage");
const shelvesEl=document.getElementById("shelves");
const poolEl=document.getElementById("pool");
const trayEl=document.getElementById("tray");
const remainEl=document.getElementById("remain");
const outEl=document.getElementById("out");
const outBody=document.getElementById("outbody");
const hintsEl=document.getElementById("hints");

const TOUCH = (window.matchMedia && matchMedia("(pointer:coarse)").matches) ||
              navigator.maxTouchPoints>1;
if(TOUCH) document.body.classList.add("touch");

let lists={pool:[],S:[],A:[],B:[],C:[],D:[]};
let picked=null, lastMoved=null, dragLock=false;

/* ---- tier rows are built once ---- */
TIERS.forEach(function(t){
  const row=document.createElement("div");
  row.className="tier"; row.dataset.t=t;
  row.innerHTML='<div class="badge">'+t+'</div><div class="shelf" id="shelf-'+t+'"></div>';
  row.addEventListener("click",function(){
    if(dragLock) return;
    if(picked!==null){ moveTo(picked,t); picked=null; }
  });
  shelvesEl.appendChild(row);
});
trayEl.addEventListener("click",function(){
  if(dragLock) return;
  if(picked!==null){ moveTo(picked,"pool"); picked=null; }
});

function zones(){
  const z=TIERS.map(function(t){
    return {key:t, el:shelvesEl.querySelector('.tier[data-t="'+t+'"]')};
  });
  z.push({key:"pool", el:trayEl});
  return z;
}

function makeCard(id){
  const ch=CHAPTERS[id], g=GROUPS[ch.group];
  const el=document.createElement("div");
  el.className="card"+(picked===id?" picked":"")+(lastMoved===id?" in":"");
  el.style.setProperty("--tint",g.tint);
  el.style.setProperty("--edge",g.edge);
  el.title=ch.name;
  el.innerHTML='<span>'+ch.short+'</span>';
  el.addEventListener("pointerdown",function(e){ startDrag(e,el,id); });
  return el;
}

function render(){
  poolEl.innerHTML="";
  lists.pool.forEach(function(id){ poolEl.appendChild(makeCard(id)); });
  TIERS.forEach(function(t){
    const sh=document.getElementById("shelf-"+t);
    sh.innerHTML="";
    lists[t].forEach(function(id){ sh.appendChild(makeCard(id)); });
  });
  const left=lists.pool.length;
  remainEl.textContent = left ? left+" of "+CHAPTERS.length+" left" : "all placed";
  lastMoved=null;
  requestAnimationFrame(relayout);
}

/* ---- every dimension on the board is derived from the stage box, in px ---- */
function clamp(lo,v,hi){ return Math.max(lo,Math.min(hi,Math.round(v))); }

function applyScale(){
  const W=stageEl.offsetWidth, H=stageEl.offsetHeight;
  if(W<80||H<80) return;
  const short=H<=820;                 /* 720p / 768p laptops and projectors */
  const set=function(k,v){ stageEl.style.setProperty(k,v+"px"); };
  set("--padx",  clamp(10, W*0.030, 30));
  set("--padt",  clamp(8,  H*0.020, 28));
  set("--padb",  clamp(6,  H*0.014, 20));
  set("--gap",   clamp(4,  H*0.0055,12));
  set("--radius",clamp(6,  H*0.010, 18));
  set("--brand", clamp(20, H*0.033, 62));
  set("--sub",   clamp(11, H*0.0125,22));
  set("--badgew",clamp(44, W*0.104, 120));
  set("--badgef",clamp(18, H*0.034, 58));
  set("--trayh", clamp(110,H*(short?0.27:0.32), 560));
  set("--traybarf",clamp(12,H*0.0125,20));
  set("--hintsf",clamp(11, H*0.0105,17));
  set("--outh2", clamp(18, H*0.022, 36));
  set("--outbody",clamp(13,H*0.012, 20));
}

/* ---- card size: one size for every tier, so the board reads as one grid ---- */
function bestSize(count,W,H,gx,gy,minS,maxS){
  if(count<=0) return maxS;
  W=W-2;                               /* sub-pixel slack, never wrap by a hair */
  let lo=minS, hi=maxS, best=minS;
  while(lo<=hi){
    const s=(lo+hi)>>1;
    const cols=Math.max(1,Math.floor((W+gx)/(s+gx)));
    const rows=Math.ceil(count/cols);
    if(rows*(s+gy)-gy<=H){ best=s; lo=s+1; } else hi=s-1;
  }
  return best;
}

function metrics(el){
  const cs=getComputedStyle(el);
  return {
    gx:parseFloat(cs.columnGap)||0, gy:parseFloat(cs.rowGap)||0,
    W:el.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight),
    H:el.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
  };
}

function shrinkToFit(el,s,minS){
  el.style.setProperty("--cw", s+"px");
  let guard=14;                        /* the browser gets the final say */
  while(guard-- > 0 && s>minS && el.scrollHeight > el.clientHeight+1){
    s=Math.max(minS, Math.floor(s*0.94));
    el.style.setProperty("--cw", s+"px");
  }
  return s;
}

function relayout(){
  applyScale();
  let tierSize=Infinity;
  const shelves=TIERS.map(function(t){ return document.getElementById("shelf-"+t); });
  shelves.forEach(function(sh,i){
    const m=metrics(sh);
    if(m.W<10||m.H<10) return;
    tierSize=Math.min(tierSize, bestSize(lists[TIERS[i]].length,m.W,m.H,m.gx,m.gy,34,180));
  });
  if(!isFinite(tierSize)) tierSize=70;
  shelves.forEach(function(sh){ shrinkToFit(sh,tierSize,34); });

  const pm=metrics(poolEl);
  if(pm.W>10&&pm.H>10){
    const cap=Math.max(40,Math.min(180,Math.round(tierSize*1.3)));
    shrinkToFit(poolEl, bestSize(lists.pool.length,pm.W,pm.H,pm.gx,pm.gy,40,cap), 40);
  }
  requestAnimationFrame(fitLabels);
}

function fitLabels(){
  const cards=document.querySelectorAll(".card:not(.ghost)");
  const groups=new Map();              /* one type size per box, so rows read evenly */
  for(let i=0;i<cards.length;i++){
    const c=cards[i], sp=c.querySelector("span");
    if(!sp) continue;
    const cs=getComputedStyle(c);
    const w=c.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h=c.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);
    if(w<4||h<4) continue;
    let lo=6, hi=Math.max(7,Math.round(c.clientWidth*0.22)), best=lo;
    while(lo<=hi){
      const mid=(lo+hi)>>1;
      sp.style.fontSize=mid+"px";
      if(sp.scrollWidth<=w+0.5 && sp.scrollHeight<=h+0.5){ best=mid; lo=mid+1; }
      else hi=mid-1;
    }
    sp.style.fontSize=best+"px";
    const box=c.parentNode, cur=groups.get(box);
    if(cur===undefined || best<cur) groups.set(box,best);
  }
  groups.forEach(function(size,box){
    const sp=box.querySelectorAll(".card:not(.ghost) span");
    for(let i=0;i<sp.length;i++) sp[i].style.fontSize=size+"px";
  });
}

function onViewportChange(){ fit(); requestAnimationFrame(relayout); }
addEventListener("resize",onViewportChange);
addEventListener("orientationchange",function(){ setTimeout(onViewportChange,300); });
if(window.visualViewport) visualViewport.addEventListener("resize",onViewportChange);

function moveTo(id,key){
  Object.keys(lists).forEach(function(k){
    lists[k]=lists[k].filter(function(x){ return x!==id; });
  });
  lists[key].push(id);
  lastMoved=id;
  render();
}

/* ---- drag, with a tap fallback ---- */
function startDrag(e,card,id){
  if(e.button!==undefined && e.button!==0) return;
  e.preventDefault();
  const x0=e.clientX, y0=e.clientY;
  let dragging=false, ghost=null;

  function onMove(ev){
    if(!dragging && Math.abs(ev.clientX-x0)+Math.abs(ev.clientY-y0)>7){
      dragging=true;
      ghost=card.cloneNode(true);
      ghost.classList.add("ghost");
      ghost.classList.remove("picked","in");
      ghost.style.width=card.offsetWidth+"px";
      ghost.style.height=card.offsetHeight+"px";
      stageEl.appendChild(ghost);
      card.classList.add("lifted");
    }
    if(!dragging) return;
    const r=stageEl.getBoundingClientRect();
    const k=(stageEl.offsetWidth ? r.width/stageEl.offsetWidth : 1) || 1;
    ghost.style.left=((ev.clientX-r.left)/k)+"px";
    ghost.style.top=((ev.clientY-r.top)/k)+"px";
    const hit=zoneAt(ev.clientX,ev.clientY);
    zones().forEach(function(z){ z.el.classList.toggle("over", hit===z.key); });
  }

  function cleanup(){
    document.removeEventListener("pointermove",onMove);
    document.removeEventListener("pointerup",onUp);
    document.removeEventListener("pointercancel",onCancel);
    zones().forEach(function(z){ z.el.classList.remove("over"); });
    if(ghost) ghost.remove();
    card.classList.remove("lifted");
  }

  function onCancel(){ cleanup(); dragLock=true; setTimeout(function(){ dragLock=false; },140); }

  function onUp(ev){
    const wasDragging=dragging, cx=ev.clientX, cy=ev.clientY;
    cleanup();
    /* swallow the click that trails this gesture, so the zone under the card
       does not immediately act on the selection we just made */
    dragLock=true; setTimeout(function(){ dragLock=false; },140);
    if(wasDragging){
      const hit=zoneAt(cx,cy);
      if(hit) moveTo(id,hit);
    }else{
      picked = (picked===id) ? null : id;
      render();
    }
  }

  document.addEventListener("pointermove",onMove);
  document.addEventListener("pointerup",onUp);
  document.addEventListener("pointercancel",onCancel);
}

function zoneAt(cx,cy){
  const hit=zones().filter(function(z){
    const r=z.el.getBoundingClientRect();
    return cx>=r.left && cx<=r.right && cy>=r.top && cy<=r.bottom;
  });
  return hit.length ? hit[0].key : null;
}

/* ---- result list ---- */
function resultText(){
  return TIERS.map(function(t){
    const names=lists[t].map(function(id){ return CHAPTERS[id].name; });
    return t+" TIER\n"+(names.length?names.map(function(n){return "  • "+n;}).join("\n"):"  (empty)");
  }).join("\n\n") + (lists.pool.length ? "\n\nNOT PLACED\n"+
    lists.pool.map(function(id){return "  • "+CHAPTERS[id].name;}).join("\n") : "");
}
function toggleList(){
  if(outEl.classList.contains("on")) outEl.classList.remove("on");
  else { outBody.textContent=resultText(); outEl.classList.add("on"); }
}
document.getElementById("close").onclick=function(){ outEl.classList.remove("on"); };
document.getElementById("listbtn").onclick=toggleList;
document.getElementById("copy").onclick=function(e){
  const btn=e.target;
  navigator.clipboard.writeText(resultText()).then(
    function(){ btn.textContent="Copied"; },
    function(){ btn.textContent="Select the text above"; }
  );
  setTimeout(function(){ btn.textContent="Copy list"; },1600);
};

/* reset asks once, so a stray tap on iPad can't wipe the board */
let armed=null;
const resetBtn=document.getElementById("resetbtn");
resetBtn.onclick=function(){
  if(armed){ clearTimeout(armed); armed=null; resetBtn.textContent="Reset"; reset(); return; }
  resetBtn.textContent="Sure?";
  armed=setTimeout(function(){ armed=null; resetBtn.textContent="Reset"; },2500);
};

addEventListener("keydown",function(e){
  if(e.target.tagName==="BUTTON") return;
  const k=e.key.toLowerCase();
  if(e.key==="Escape"){ outEl.classList.remove("on"); picked=null; render(); return; }
  if(["s","a","b","c","d"].indexOf(k)>-1){
    if(picked!==null){ e.preventDefault(); moveTo(picked,k.toUpperCase()); picked=null; }
  }
  else if(k==="x") toggleList();
  else if(k==="h") hintsEl.classList.toggle("hide");
  else if(k==="r") reset();
});

function reset(){
  lists={pool:CHAPTERS.map(function(c){return c.id;}),S:[],A:[],B:[],C:[],D:[]};
  picked=null; lastMoved=null;
  outEl.classList.remove("on");
  render();
}
function fit(){
  if(stageEl.classList.contains("reel")){
    const k=Math.min(fitEl.clientWidth/1080, fitEl.clientHeight/1920);
    stageEl.style.transform="translate(-50%,-50%) scale("+k+")";
  } else {
    stageEl.style.transform="none";
  }
}
document.getElementById("reelbtn").onclick=function(e){
  stageEl.classList.toggle("reel");
  e.target.textContent = stageEl.classList.contains("reel") ? "Fill screen" : "Reel 9:16";
  fit(); requestAnimationFrame(relayout);
};

/* keep iPad's double-tap / pinch zoom from fighting the board */
document.addEventListener("gesturestart",function(e){ e.preventDefault(); });
document.addEventListener("dblclick",function(e){ e.preventDefault(); });

fit(); reset();
/* the web font changes text metrics, and iOS settles its viewport late */
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ requestAnimationFrame(relayout); });
setTimeout(onViewportChange,400);
setTimeout(onViewportChange,1200);
</script>
